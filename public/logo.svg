<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">श्रद्धानंद Jewellery</title>
  <desc id="desc">Luxury Sanskrit brand emblem for Shraddhanand Jewellery with solitaire diamond star and filigree gold ring</desc>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B742F"/>
      <stop offset="25%" stop-color="#D8B45C"/>
      <stop offset="50%" stop-color="#FBF0D2"/>
      <stop offset="75%" stop-color="#D8B45C"/>
      <stop offset="100%" stop-color="#8E6B2A"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8B45C"/>
      <stop offset="50%" stop-color="#FFF5DC"/>
      <stop offset="100%" stop-color="#9B742F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Fine Jewellery Halo Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Primary Luxury Gold Circle -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Inner Milgrain Beaded Border -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.8"/>

  <!-- Top Solitaire Diamond Star Accent -->
  <g transform="translate(50, 8)" filter="url(#glow)">
    <path d="M0 -5 L1.8 -1.2 L5 0 L1.8 1.2 L0 5 L-1.8 1.2 L-5 0 L-1.8 -1.2 Z" fill="url(#goldLight)"/>
    <circle cx="0" cy="0" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Solitaire Diamond Star Accent -->
  <g transform="translate(50, 92)" filter="url(#glow)">
    <path d="M0 -3 L1.2 -0.8 L3 0 L1.2 0.8 L0 3 L-1.2 0.8 L-3 0 L-1.2 -0.8 Z" fill="url(#goldLight)"/>
    <circle cx="0" cy="0" r="0.6" fill="#FFFFFF"/>
  </g>

  <!-- Left & Right Micro Jewels -->
  <circle cx="8" cy="50" r="1.5" fill="url(#gold)"/>
  <circle cx="92" cy="50" r="1.5" fill="url(#gold)"/>

  <!-- Central Sanskrit Ligature "श्र" (Shra) for Shraddhanand in Polished Luxury Serif Form -->
  <g fill="url(#gold)" stroke="url(#gold)" stroke-width="0.3" stroke-linejoin="round">
    <!-- Top Horizontal Shirorekha (Header line) -->
    <path d="M26 31 L74 31 A 1.2 1.2 0 0 1 74 33.4 L26 33.4 A 1.2 1.2 0 0 1 26 31 Z" />
    
    <!-- Central Sanskrit "श्र" Letterform with elegant calligraphic flair -->
    <!-- Vertical stem -->
    <path d="M57.5 32 L60.5 32 L60.5 68 A 1.5 1.5 0 0 1 57.5 68 Z" />
    
    <!-- Upper loop of "श" -->
    <path d="M58 42 C 58 37, 43 36, 43 43 C 43 48, 54 48, 54 53 C 54 57, 46 58, 41 55 C 39.5 54, 38.5 55.5, 39.5 57 C 44 61.5, 57 59.5, 57 52 C 57 46, 46 45.5, 46 42.5 C 46 39.5, 54 39.5, 58 42.5 Z" />
    
    <!-- Downward ra-kar stroke (the distinctive Sanskrit diagonal foot of 'Shra') -->
    <path d="M48 50 L34 68 C 33 69.2, 31.5 68, 32.5 67 L46.5 49 Z" />

    <!-- Right supporting serif stroke of 'Shra' -->
    <path d="M58 45 L69 66 C 69.8 67.2, 68.2 68.2, 67.2 67.2 L57 48 Z" />

    <!-- Solitaire Bindu (Anusvara diamond above Shirorekha) -->
    <path d="M50 22 L52 24.5 L50 27 L48 24.5 Z" fill="url(#goldLight)"/>
    <circle cx="50" cy="24.5" r="0.75" fill="#FFFFFF"/>
  </g>
</svg>
